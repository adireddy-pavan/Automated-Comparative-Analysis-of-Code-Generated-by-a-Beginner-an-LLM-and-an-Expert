# OPTIONAL SonarQube scanner configuration — NOT required to run this project.
#
# The core pipeline measures complexity / maintainability / security with
# radon, pylint and bandit and never needs a SonarQube server. This template is
# provided only for users who already run SonarQube and want a second opinion.
# See ../docs/SONARQUBE.md for setup. Move/copy this file to the project root
# before running `sonar-scanner`, or pass -Dproject.settings=sonar/sonar-project.properties.

sonar.projectKey=tharun-project
sonar.projectName=Tharun Project
sonar.projectVersion=1.0

# Analyse the benchmark solutions (the subjects of the study).
sonar.sources=dataset/tasks
sonar.inclusions=**/solutions/*.py

# Keep the framework, tests and generated artifacts out of the scan.
sonar.exclusions=.venv/**,**/__pycache__/**,outputs/**,figures/**,report/**,evidence/**
sonar.test.exclusions=**/tests/**

sonar.python.version=3.10, 3.11, 3.12, 3.13
sonar.sourceEncoding=UTF-8

# Optional: feed bandit/pylint reports to Sonar if you generate them in the
# external formats Sonar expects (see docs/SONARQUBE.md).
# sonar.python.bandit.reportPaths=evidence/bandit_all.json
# sonar.python.pylint.reportPaths=evidence/pylint_all.txt
