[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comparative-code-analysis"
version = "1.0.0"
description = "Automated comparative analysis of code generated by a beginner, an LLM, and an expert"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "radon>=6.0.1",
    "pylint>=3.0",
    "bandit>=1.7.5",
    "pytest>=8.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "markdown>=3.5",
    "tabulate>=0.9",
    "python-docx>=1.1",
]

[tool.setuptools]
packages = ["src"]
py-modules = ["config", "run_analysis"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Only the framework's own tests live in tests/. The benchmark solutions under
# dataset/ are subjects of study, not part of the suite.
norecursedirs = ["dataset", ".venv", "outputs", "figures", "report", "evidence"]

# --------------------------------------------------------------------------- #
# pylint  (the framework dogfoods our own tool on itself; CI gates on this)
# --------------------------------------------------------------------------- #
[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["dataset/.*", "\\.venv/.*"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
# do_GET / do_POST are mandated names overriding http.server handler methods.
good-names-rgxs = ["^do_[A-Z]+$"]

[tool.pylint."messages control"]
# These are deliberate, documented design choices in an orchestration/reporting
# tool, not defects:
#   - import-outside-toplevel : optional deps (python-docx) imported lazily.
#   - broad-exception-caught  : best-effort robustness paths that log & continue
#                               so one bad solution never aborts a whole run.
#   - wrong-import-position   : a sys.path bootstrap precedes local imports.
#   - too-many-*              : cohesive report/orchestration builders read more
#                               clearly as single linear functions.
#   - duplicate-code          : table-building blocks are intentionally parallel.
disable = [
    "import-outside-toplevel",
    "broad-exception-caught",
    "wrong-import-position",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-few-public-methods",
    "duplicate-code",
]

# --------------------------------------------------------------------------- #
# bandit  (security scan of the framework; dataset subjects are excluded)
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["dataset", ".venv", "tests"]
# Checks skipped after manual review (each is inapplicable or an architectural
# decision, not a defect). Pass `-c pyproject.toml` so bandit reads this.
#   B105      - "hardcoded password" false positives on field names containing
#               "pass" (functional_pass, pass@1); this tool stores no secrets.
#   B404/B603 - subprocess is core to invoking radon/pylint/bandit/pytest; every
#               call uses a fixed argument list, never a shell, never user input.
#   B704      - markupsafe.Markup wraps only content we have already HTML-escaped
#               (see highlight() and _json_for_script()).
#   B310      - urllib.urlopen in the OPTIONAL llm regenerator targets a fixed
#               https constant whose scheme is asserted before the call.
skips = ["B105", "B404", "B603", "B704", "B310"]
